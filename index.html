<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TorobLite</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: url('https://images.unsplash.com/photo-1503264116251-35a269479413?auto=format&fit=crop&w=1400&q=80') no-repeat center/cover;
  backdrop-filter: blur(8px);
}

/* Glass Header */
header {
  position: fixed;
  top: 0;
  width: 100%;
  padding: 15px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.2);
  color: white;
}

/* Hero Section */
.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 25px;
  color: white;
  text-shadow: 0 0 20px rgba(0,0,0,0.5);
}

.hero h1 {
  font-size: 45px;
  margin: 0;
}

.hero p {
  font-size: 18px;
  margin-top: 10px;
}

.btn {
  margin-top: 25px;
  padding: 12px 25px;
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(10px);
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  background: rgba(255,255,255,0.4);
}

/* Cards */
.cards {
  padding: 60px 25px;
  display: grid;
  gap: 20px;
}

.card {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  padding: 20px;
  border-radius: 15px;
  color: white;
  border: 1px solid rgba(255,255,255,0.2);
}

/* VIP Footer */
.footer {
  margin-top: 40px;
  padding: 40px 25px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(255,255,255,0.25);
  color: white;
  text-align: center;
}

.footer-content h2 {
  margin: 0;
  font-size: 28px;
  text-shadow: 0 0 15px rgba(255,255,255,0.4);
}

.footer-content p {
  margin: 10px 0;
  font-size: 15px;
  opacity: 0.9;
}

.footer-links {
  margin: 20px 0;
  display: flex;
  justify-content: center;
  gap: 25px;
}

.footer-links a {
  color: white;
  text-decoration: none;
  font-size: 16px;
  padding: 8px 12px;
  border-radius: 10px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.25);
  transition: 0.3s;
}

.footer-links a:hover {
  background: rgba(255,255,255,0.35);
}

.copy {
  margin-top: 25px;
  font-size: 13px;
  opacity: 0.7;
}
</style>
</head>

<body>

<header>
  <div>TorobLite</div>
  <div>منو</div>
</header>

<section class="hero">
  <h1>سایت VIP شما</h1>
  <p>طراحی شیشه‌ای، مدرن و فوق‌العاده جذاب</p>
  <button class="btn">شروع کن</button>
</section>

<section class="cards">
  <div class="card">ظاهر شیشه‌ای حرفه‌ای</div>
  <div class="card">سرعت بالا با Cloudflare</div>
  <div class="card">کاملاً موبایل‌پسند</div>
</section>

<footer class="footer">
  <div class="footer-content">
    <h2>TorobLite</h2>
    <p>سرویس‌های حرفه‌ای با طراحی VIP و سرعت بالا</p>

    <div class="footer-links">
      <a href="#">خانه</a>
      <a href="#">درباره ما</a>
      <a href="#">خدمات</a>
      <a href="#">تماس با ما</a>
    </div>

    <p class="copy">© 2026 TorobLite — All Rights Reserved</p>
  </div>
</footer>

</body>
</html>
