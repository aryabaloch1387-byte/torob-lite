<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>جستجوی قیمت | نسخه ترب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box">
    <h2>جستجوی قیمت کالا</h2>
    <input id="searchInput" type="text" placeholder="نام کالا را وارد کنید...">
    <button onclick="startSearch()">جستجو</button>
</div>

<script>
function startSearch() {
    const q = document.getElementById("searchInput").value;
    window.location.href = `search.html?q=${q}`;
}
</script>

</body>
</html>
