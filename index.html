<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TorobLite VIP</title>

<link href="https://cdn.jsdelivr.net/gh/rastikerdar/iransansx@v1.0.0/dist/font-face.css" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: 'IRANSansX', sans-serif;
  color: #333;
}

/* هدر */
header {
  background: #ffffff;
  border-bottom: 1px solid #e0e0e0;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 1000;
}

header .logo {
  font-size: 22px;
  font-weight: 700;
  color: #444;
}

header nav a {
  margin-left: 15px;
  text-decoration: none;
  color: #444;
  font-size: 15px;
  font-weight: 500;
}

/* هیرو */
.hero {
  margin-top: 80px;
  background: #fff;
  padding: 30px 20px;
  text-align: center;
  border-bottom: 1px solid #e0e0e0;
}

.hero h1 {
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 10px;
}

.hero p {
  font-size: 15px;
  color: #666;
}

.btn-main {
  background: #ff3b3b;
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  text-decoration: none;
  font-size: 15px;
  display: inline-block;
  margin-top: 15px;
}

/* دسته‌بندی‌ها */
.categories {
  padding: 20px;
}

.cat-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 15px;
}

.cat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.cat-item {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  border: 1px solid #e6e6e6;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  text-align: center;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: 0.2s;
}

.cat-item:hover {
  background: #f0f0f0;
}

/* فوتر */
footer {
  margin-top: 40px;
  background: #fff;
  padding: 20px;
  text-align: center;
  border-top: 1px solid #e0e0e0;
  color: #777;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <div class="logo">TorobLite VIP</div>
  <nav>
    <a href="category.html">دسته‌بندی‌ها</a>
    <a href="products.html">محصولات</a>
    <a href="order.html">سفارش</a>
    <a href="seller.html">داشبورد فروشنده</a>
  </nav>
</header>

<div class="hero">
  <h1>TorobLite VIP</h1>
  <p>سایت معتبر، تمیز، حرفه‌ای با دسته‌بندی و ظاهر استاندارد فروشگاهی</p>
  <a class="btn-main" href="products.html">مشاهده محصولات</a>
</div>

<div class="categories">
  <div class="cat-title">دسته‌بندی‌ها</div>

  <div class="cat-grid">
    <a class="cat-item" href="products.html?cat=mobile">موبایل و تبلت</a>
    <a class="cat-item" href="products.html?cat=laptop">لپ‌تاپ و کامپیوتر</a>
    <a class="cat-item" href="products.html?cat=home">لوازم خانگی</a>
    <a class="cat-item" href="products.html?cat=fashion">پوشاک و مد</a>
    <a class="cat-item" href="products.html?cat=beauty">زیبایی و سلامت</a>
    <a class="cat-item" href="products.html?cat=sport">ورزشی و سرگرمی</a>
  </div>
</div>

<footer>
  © 2026 TorobLite — All Rights Reserved
</footer>

</body>
</html>
