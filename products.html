
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fb">
<title>محصولات و مقایسه قیمت | ترب لایت</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/iransansx@v1.0.0/dist/font-face.css" rel="stylesheet">

<style>
*{box-sizing:border-box}
:root{--red:#ed3545;--ink:#20232b;--muted:#747986;--line:#e8ebf1;--bg:#f7f8fb}
body{margin:0;background:var(--bg);color:var(--ink);font-family:IRANSansX,Tahoma,sans-serif;line-height:1.8}
a{text-decoration:none;color:inherit}
button,input,select{font:inherit}
header{background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:1100px;margin:auto;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:900;font-size:21px;color:var(--red)}
.back{font-size:13px;color:#555}
main{max-width:1100px;margin:auto;padding:30px 18px 50px}
h1{font-size:25px;margin:0 0 4px}
.sub{font-size:13px;color:var(--muted);margin:0 0 22px}
.search{display:flex;gap:8px;background:white;padding:8px;border:1px solid var(--line);border-radius:15px;margin-bottom:15px}
.search input{min-width:0;flex:1;border:0;outline:0;padding:8px;font-size:14px}
button,.search button{border:0;background:var(--red);color:white;border-radius:10px;padding:10px 17px;cursor:pointer}
.filters{display:flex;gap:9px;margin-bottom:18px}
select{min-width:0;flex:1;background:white;border:1px solid var(--line);padding:11px;border-radius:11px;color:var(--ink)}
.notice{background:#fff8e8;border:1px solid #f2dfad;color:#745719;border-radius:12px;padding:12px 14px;font-size:12px;margin-bottom:22px}
.summary{font-size:13px;color:var(--muted);margin-bottom:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0;box-shadow:0 5px 20px #20232b06}
.product-head{display:flex;align-items:center;gap:14px;margin-bottom:15px}
.photo{width:78px;height:78px;flex-shrink:0;border-radius:15px;background:#fff0f1;display:grid;place-items:center;font-size:34px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain}
.product-name{font-size:15px;font-weight:800;line-height:1.8;overflow-wrap:anywhere}
.category{font-size:11px;color:var(--muted)}
.offers-title{font-size:12px;font-weight:700;border-top:1px solid var(--line);padding-top:12px;margin-bottom:8px}
.offer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #f0f1f5}
.offer:last-child{border-bottom:0}
.shop{font-size:12px;color:#555;overflow-wrap:anywhere}
.price{font-weight:900;font-size:13px;white-space:nowrap}
.buy{display:inline-block;background:#fff0f1;color:var(--red);font-size:11px;font-weight:700;border-radius:8px;padding:6px 10px;margin-top:5px}
.empty,.error{background:white;border:1px solid var(--line);border-radius:18px;padding:35px 18px;text-align:center;color:var(--muted)}
.empty strong,.error strong{display:block;color:var(--ink);font-size:18px;margin-bottom:8px}
.hidden{display:none}
footer{text-align:center;padding:22px;background:white;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
@media(max-width:600px){
 main{padding:23px 13px 35px}
 h1{font-size:22px}
 .grid{grid-template-columns:1fr;gap:12px}
 .card{padding:15px}
 .photo{width:68px;height:68px}
 .top{padding:12px 14px}
}
</style>
</head>
<body>

<header>
  <div class="top">
    <a class="logo" href="index.html">ترب لایت</a>
    <a class="back" href="index.html">بازگشت به صفحه اصلی ←</a>
  </div>
</header>

<main>
  <h1 id="heading">محصولات</h1>
  <p class="sub">محصولات ثبت‌شده را جست‌وجو کن و قیمت‌های موجود را مقایسه کن.</p>

  <form class="search" id="searchForm">
    <input id="query" type="search" placeholder="نام محصول را بنویس..." aria-label="جست‌وجوی محصول">
    <button type="submit">جست‌وجو</button>
  </form>

  <div class="filters">
    <select id="category" aria-label="فیلتر دسته‌بندی">
      <option value="">همه دسته‌ها</option>
      <option value="mobile">موبایل و تبلت</option>
      <option value="laptop">لپ‌تاپ و کامپیوتر</option>
      <option value="home">لوازم خانگی</option>
      <option value="fashion">پوشاک و مد</option>
      <option value="beauty">زیبایی و سلامت</option>
      <option value="sport">ورزش و سرگرمی</option>
    </select>
  </div>

  <div class="notice">
    توجه: اطلاعات فعلی آزمایشی است و قیمت‌ها به‌صورت زنده بررسی نمی‌شوند.
    قبل از خرید، قیمت و موجودی را در وب‌سایت فروشنده تأیید کن.
  </div>

  <div id="summary" class="summary">در حال بارگذاری محصولات...</div>
  <section id="products" class="grid" aria-live="polite"></section>
  <section id="message" class="empty hidden"></section>
</main>

<footer>© 2026 ترب لایت — انتخاب آگاهانه‌تر</footer>

<script>
const $ = id => document.getElementById(id);

const categoryNames = {
  mobile: "موبایل و تبلت",
  laptop: "لپ‌تاپ و کامپیوتر",
  home: "لوازم خانگی",
  fashion: "پوشاک و مد",
  beauty: "زیبایی و سلامت",
  sport: "ورزش و سرگرمی"
};

const params = new URLSearchParams(location.search);
$("query").value = params.get("q") || "";
$("category").value = params.get("cat") || "";

function categoryMatches(product, selected) {
  if (!selected) return true;
  const value = String(product.category || "").toLowerCase();
  if (selected === "mobile") return value.includes("موبایل") || value.includes("تبلت");
  if (selected === "laptop") return value.includes("لپ‌تاپ") || value.includes("لپ تاپ") || value.includes("کامپیوتر");
  if (selected === "home") return value.includes("خانگی");
  if (selected === "fashion") return value.includes("پوشاک") || value.includes("مد");
  if (selected === "beauty") return value.includes("زیبایی") || value.includes("سلامت");
  if (selected === "sport") return value.includes("ورزش") || value.includes("سرگرمی");
  return false;
}

function formatPrice(price) {
  const n = Number(price);
  if (!Number.isFinite(n) || n <= 0) return "قیمت ثبت نشده";
  return n.toLocaleString("fa-IR") + " تومان";
}

function makeCard(product) {
  const card = document.createElement("article");
  card.className = "card";

  const head = document.createElement("div");
  head.className = "product-head";

  const photo = document.createElement("div");
  photo.className = "photo";
  photo.textContent = "🛍️";

  if (product.image && !product.image.includes("via.placeholder.com")) {
    const img = document.createElement("img");
    img.src = product.image;
    img.alt = product.name || "تصویر محصول";
    img.onerror = () => { img.remove(); photo.textContent = "🛍️"; };
    photo.textContent = "";
    photo.appendChild(img);
  }

  const details = document.createElement("div");
  const name = document.createElement("div");
  name.className = "product-name";
  name.textContent = product.name || "محصول بدون نام";

  const category = document.createElement("div");
  category.className = "category";
  category.textContent = product.category || "دسته‌بندی نامشخص";

  details.append(name, category);
  head.append(photo, details);
  card.appendChild(head);

  const offersTitle = document.createElement("div");
  offersTitle.className = "offers-title";
  offersTitle.textContent = "قیمت‌های ثبت‌شده در فایل داده";
  card.appendChild(offersTitle);

  const offers = Array.isArray(product.offers) ? product.offers : [];
  const validOffers = offers.filter(o => Number(o.price) > 0);

  if (!validOffers.length) {
    const noOffer = document.createElement("div");
    noOffer.className = "shop";
    noOffer.textContent = "برای این محصول قیمتی ثبت نشده است.";
    card.appendChild(noOffer);
  } else {
    validOffers.sort((a,b) => Number(a.price) - Number(b.price));

    validOffers.forEach(offer => {
      const row = document.createElement("div");
      row.className = "offer";

      const info = document.createElement("div");
      const shop = document.createElement("div");
      shop.className = "shop";
      shop.textContent = offer.shop || "فروشگاه";

      const price = document.createElement("div");
      price.className = "price";
      price.textContent = formatPrice(offer.price);
      info.append(shop, price);

      const link = document.createElement("a");
      link.className = "buy";
      link.textContent = "بررسی فروشگاه";
      link.href = offer.url || "#";
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      if (!offer.url || !/^https?:\/\//i.test(offer.url)) {
        link.removeAttribute("target");
        link.href = "#";
        link.addEventListener("click", e => {
          e.preventDefault();
          alert("لینک فروشگاه برای این پیشنهاد ثبت نشده است.");
        });
      }

      row.append(info, link);
      card.appendChild(row);
    });
  }

  return card;
}

async function renderProducts() {
  $("products").replaceChildren();
  $("message").classList.add("hidden");
  $("summary").textContent = "در حال بارگذاری محصولات...";

  try {
    const response = await fetch("./data.json", { cache: "no-store" });
    if (!response.ok) throw new Error("data.json unavailable");

    const data = await response.json();
    if (!Array.isArray(data.products)) throw new Error("Invalid product data");

    const q = $("query").value.trim().toLocaleLowerCase("fa");
    const cat = $("category").value;

    const results = data.products.filter(product => {
      const matchesQuery = String(product.name || "")
        .toLocaleLowerCase("fa").includes(q);
      return matchesQuery && categoryMatches(product, cat);
    });

    $("heading").textContent = cat && categoryNames[cat]
      ? categoryNames[cat] : "محصولات";

    $("summary").textContent =
      results.length.toLocaleString("fa-IR") + " محصول در داده‌های فعلی پیدا شد";

    if (!results.length) {
      $("message").classList.remove("hidden");
      $("message").innerHTML =
        "<strong>محصولی پیدا نشد</strong><span>عبارت جست‌وجو یا دسته‌بندی را تغییر بده. برای این دسته هنوز محصولی در فایل داده ثبت نشده است.</span>";
      return;
    }

    results.forEach(product => $("products").appendChild(makeCard(product)));
  } catch (error) {
    $("summary").textContent = "";
    $("message").classList.remove("hidden");
    $("message").innerHTML =
      "<strong>بارگذاری محصولات انجام نشد</strong><span>فایل data.json پیدا نشد یا اطلاعات آن معتبر نیست. نام و محل فایل را در GitHub بررسی کن.</span>";
  }
}

$("searchForm").addEventListener("submit", event => {
  event.preventDefault();
  const next = new URLSearchParams();
  if ($("query").value.trim()) next.set("q", $("query").value.trim());
  if ($("category").value) next.set("cat", $("category").value);
  history.replaceState(null, "", location.pathname + (next.size ? "?" + next.toString() : ""));
  renderProducts();
});

$("category").addEventListener("change", renderProducts);
renderProducts();
</script>
</body>
</html>
