<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل فروشنده TorobLite</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: url('https://images.unsplash.com/photo-1503264116251-35a269479413?auto=format&fit=crop&w=1400&q=80') no-repeat center/cover;
  backdrop-filter: blur(8px);
  color: white;
}

/* Header */
header {
  position: fixed;
  top: 0;
  width: 100%;
  padding: 15px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.2);
  z-index: 1000;
}

header a {
  color: white;
  text-decoration: none;
  background: rgba(255,255,255,0.12);
  padding: 6px 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.3);
  font-size: 13px;
}

/* Container */
.container {
  padding: 100px 20px 40px;
}

/* Glass block */
.glass {
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(14px);
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.25);
  padding: 20px;
  margin-bottom: 20px;
}

/* Titles */
h2 {
  margin-top: 0;
}

/* Inputs */
input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.35);
  background: rgba(0,0,0,0.35);
  color: white;
  font-size: 14px;
}

/* Button */
.btn {
  width: 100%;
  padding: 11px;
  margin-top: 12px;
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 10px;
  cursor: pointer;
  color: white;
  font-size: 15px;
}

/* Product card */
.product-card {
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(12px);
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.25);
  padding: 15px;
  margin-bottom: 10px;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <div>پنل فروشنده TorobLite</div>
  <a href="index.html">بازگشت به سایت</a>
</header>

<div class="container">

  <!-- ورود ساده -->
  <div class="glass" id="loginBox">
    <h2>ورود فروشنده</h2>
    <p>فقط شماره موبایل خود را وارد کنید تا وارد پنل شوید.</p>
    <input id="sellerPhone" placeholder="شماره موبایل">
    <button class="btn" onclick="loginSeller()">ورود به پنل</button>
    <p id="loginStatus" style="margin-top:8px;font-size:13px;"></p>
  </div>

  <!-- داشبورد -->
  <div class="glass" id="dashboard" style="display:none;">
    <h2>داشبورد فروشنده</h2>
    <button class="btn" onclick="showAddProduct()">افزودن محصول جدید</button>
    <button class="btn" onclick="showProducts()">مشاهده محصولات</button>
    <button class="btn" onclick="showSettings()">تنظیمات فروشگاه</button>
  </div>

  <!-- افزودن محصول -->
  <div class="glass" id="addProduct" style="display:none;">
    <h2>افزودن محصول</h2>
    <input id="pName" placeholder="نام محصول">
    <input id="pPrice" placeholder="قیمت (تومان)">
    <textarea id="pDesc" placeholder="توضیحات کوتاه محصول"></textarea>
    <button class="btn" onclick="saveProduct()">ثبت محصول</button>
    <button class="btn" onclick="backDashboard()">بازگشت به داشبورد</button>
    <p id="addStatus" style="margin-top:8px;font-size:13px;"></p>
  </div>

  <!-- لیست محصولات -->
  <div class="glass" id="productList" style="display:none;">
    <h2>محصولات من</h2>
    <div id="productsContainer"></div>
    <button class="btn" onclick="backDashboard()">بازگشت به داشبورد</button>
  </div>

  <!-- تنظیمات فروشگاه -->
  <div class="glass" id="settings" style="display:none;">
    <h2>تنظیمات فروشگاه</h2>
    <input id="sName" placeholder="نام فروشگاه">
    <input id="sAddress" placeholder="آدرس (اختیاری)">
    <input id="sPhone" placeholder="شماره تماس">
    <input id="sWhatsApp" placeholder="لینک واتساپ">
    <input id="sInsta" placeholder="آیدی اینستاگرام">
    <button class="btn" onclick="saveSettings()">ذخیره تنظیمات</button>
    <button class="btn" onclick="backDashboard()">بازگشت به داشبورد</button>
    <p id="setStatus" style="margin-top:8px;font-size:13px;"></p>
  </div>

</div>

<script>
let sellerLogged = false;
let products = [];

function loginSeller() {
  const phone = document.getElementById("sellerPhone").value;
  const status = document.getElementById("loginStatus");

  if (!phone) {
    status.textContent = "لطفاً شماره موبایل را وارد کنید.";
    return;
  }

  sellerLogged = true;
  status.textContent = "ورود موفق! شما وارد پنل شدید.";
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
}

function showAddProduct() {
  hideAll();
  document.getElementById("addProduct").style.display = "block";
}

function showProducts() {
  hideAll();
  document.getElementById("productList").style.display = "block";

  const container = document.getElementById("productsContainer");
  container.innerHTML = "";

  if (products.length === 0) {
    container.innerHTML = "<p>هنوز محصولی ثبت نشده.</p>";
    return;
  }

  products.forEach(p => {
    container.innerHTML += `
      <div class="product-card">
        <strong>${p.name}</strong><br>
        قیمت: ${p.price} تومان<br>
        <span>${p.desc}</span>
      </div>
    `;
  });
}

function showSettings() {
  hideAll();
  document.getElementById("settings").style.display = "block";
}

function saveProduct() {
  const name = document.getElementById("pName").value;
  const price = document.getElementById("pPrice").value;
  const desc = document.getElementById("pDesc").value;
  const status = document.getElementById("addStatus");

  if (!name || !price) {
    status.textContent = "نام و قیمت محصول الزامی است.";
    return;
  }

  products.push({ name, price, desc });
  status.textContent = "محصول با موفقیت ثبت شد.";
  document.getElementById("pName").value = "";
  document.getElementById("pPrice").value = "";
  document.getElementById("pDesc").value = "";
}

function saveSettings() {
  const status = document.getElementById("setStatus");
  status.textContent = "تنظیمات فروشگاه ذخیره شد (دمو).";
}

function backDashboard() {
  hideAll();
  document.getElementById("dashboard").style.display = "block";
}

function hideAll() {
  document.getElementById("addProduct").style.display = "none";
  document.getElementById("productList").style.display = "none";
  document.getElementById("settings").style.display = "none";
}
</script>

</body>
</html>
