<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد فروشنده | TorobLite VIP</title>

<link href="https://cdn.jsdelivr.net/gh/rastikerdar/iransansx@v1.0.0/dist/font-face.css" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: 'IRANSansX', sans-serif;
  color: #333;
}

/* هدر */
header {
  background: #ffffff;
  border-bottom: 1px solid #e0e0e0;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 1000;
}

header .logo {
  font-size: 20px;
  font-weight: 700;
  color: #444;
}

header a {
  text-decoration: none;
  color: #444;
  font-size: 15px;
  font-weight: 500;
}

/* محتوا */
.container {
  padding: 100px 20px 40px;
}

.box {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  border: 1px solid #e6e6e6;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  margin-bottom: 20px;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 14px;
  font-family: 'IRANSansX';
}

.btn {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  background: #ff3b3b;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  color: white;
  font-size: 15px;
  font-weight: 600;
}

.btn-secondary {
  background: #555;
}

/* کارت محصول */
.product-card {
  background: #fafafa;
  border: 1px solid #ddd;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<header>
  <div class="logo">پنل فروشنده TorobLite VIP</div>
  <a href="index.html">بازگشت</a>
</header>

<div class="container">

  <div class="box" id="loginBox">
    <h2>ورود فروشنده</h2>
    <p>شماره موبایل خود را وارد کنید:</p>
    <input id="sellerPhone" placeholder="+98xxxxxxxxxx">
    <button class="btn" onclick="loginSeller()">ارسال کد تایید</button>
    <p id="loginStatus" style="margin-top:8px;font-size:13px;color:#555;"></p>
  </div>

  <div id="recaptcha-container"></div>

  <div class="box" id="dashboard" style="display:none;">
    <h2>داشبورد فروشنده</h2>
    <button class="btn" onclick="showAddProduct()">افزودن محصول جدید</button>
    <button class="btn" onclick="showProducts()">مشاهده محصولات</button>
    <button class="btn" onclick="showSettings()">تنظیمات فروشگاه</button>
  </div>

  <div class="box" id="addProduct" style="display:none;">
    <h2>افزودن محصول</h2>
    <input id="pName" placeholder="نام محصول">
    <input id="pPrice" placeholder="قیمت (تومان)">
    <textarea id="pDesc" placeholder="توضیحات محصول"></textarea>
    <button class="btn" onclick="saveProduct()">ثبت محصول</button>
    <button class="btn btn-secondary" onclick="backDashboard()">بازگشت</button>
    <p id="addStatus" style="margin-top:8px;font-size:13px;color:#555;"></p>
  </div>

  <div class="box" id="productList" style="display:none;">
    <h2>محصولات من</h2>
    <div id="productsContainer"></div>
    <button class="btn btn-secondary" onclick="backDashboard()">بازگشت</button>
  </div>

  <div class="box" id="settings" style="display:none;">
    <h2>تنظیمات فروشگاه</h2>
    <input id="sName" placeholder="نام فروشگاه">
    <input id="sAddress" placeholder="آدرس">
    <input id="sPhone" placeholder="شماره تماس">
    <input id="sWhatsApp" placeholder="واتساپ">
    <input id="sInsta" placeholder="اینستاگرام">
    <button class="btn" onclick="saveSettings()">ذخیره</button>
    <button class="btn btn-secondary" onclick="backDashboard()">بازگشت</button>
    <p id="setStatus" style="margin-top:8px;font-size:13px;color:#555;"></p>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script src="firebase-config.js"></script>

<script>
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

function loginSeller() {
  const phone = document.getElementById("sellerPhone").value;
  const status = document.getElementById("loginStatus");

  if (!phone) {
    status.textContent = "شماره موبایل را وارد کنید.";
    return;
  }

  window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
    size: 'invisible'
  });

  auth.signInWithPhoneNumber(phone, window.recaptchaVerifier)
    .then(confirmationResult => {
      window.confirmationResult = confirmationResult;
      status.innerHTML = `
        کد تایید ارسال شد.<br>
        <input id="otpCode" placeholder="کد تایید">
        <button class="btn" onclick="verifyOTP()">تایید کد</button>
      `;
    })
    .catch(err => {
      status.textContent = "خطا: " + err.message;
    });
}

function verifyOTP() {
  const code = document.getElementById("otpCode").value;
  const status = document.getElementById("loginStatus");

  confirmationResult.confirm(code)
    .then(result => {
      status.textContent = "ورود موفق!";
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
    })
    .catch(err => {
      status.textContent = "کد اشتباه است.";
    });
}

function saveProduct() {
  const name = document.getElementById("pName").value;
  const price = document.getElementById("pPrice").value;
  const desc = document.getElementById("pDesc").value;
  const status = document.getElementById("addStatus");

  if (!name || !price) {
    status.textContent = "نام و قیمت لازم است.";
    return;
  }

  db.collection("products").add({
    name,
    price,
    desc,
    seller: auth.currentUser.phoneNumber,
    createdAt: Date.now()
  }).then(() => {
    status.textContent = "محصول ثبت شد.";
  });
}

function showProducts() {
  hideAll();
  document.getElementById("productList").style.display = "block";

  const container = document.getElementById("productsContainer");
  container.innerHTML = "در حال بارگذاری...";

  db.collection("products")
    .where("seller", "==", auth.currentUser.phoneNumber)
    .get()
    .then(snapshot => {
      container.innerHTML = "";
      if (snapshot.empty) {
        container.innerHTML = "<p>محصولی ثبت نشده.</p>";
        return;
      }

      snapshot.forEach(doc => {
        const p = doc.data();
        container.innerHTML += `
          <div class="product-card">
            <strong>${p.name}</strong><br>
            قیمت: ${p.price} تومان<br>
            ${p.desc}
          </div>
        `;
      });
    });
}

function saveSettings() {
  const status = document.getElementById("setStatus");

  db.collection("stores").doc(auth.currentUser.phoneNumber).set({
    name: document.getElementById("sName").value,
    address: document.getElementById("sAddress").value,
    phone: document.getElementById("sPhone").value,
    whatsapp: document.getElementById("sWhatsApp").value,
    insta: document.getElementById("sInsta").value
  }).then(() => {
    status.textContent = "تنظیمات ذخیره شد.";
  });
}

function hideAll() {
  document.getElementById("addProduct").style.display = "none";
  document.getElementById("productList").style.display = "none";
  document.getElementById("settings").style.display = "none";
}

function showAddProduct() {
  hideAll();
  document.getElementById("addProduct").style.display = "block";
}

function showSettings() {
  hideAll();
  document.getElementById("settings").style.display = "block";
}

function backDashboard() {
  hideAll();
  document.getElementById("dashboard").style.display = "block";
}
</script>

</body>
</html>
