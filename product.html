
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>جزئیات محصول | TorobLite</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fa;
      color: #202938;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .logo { font-size: 20px; font-weight: bold; color: #e94b35; }
    a { color: inherit; }
    .back { text-decoration: none; font-size: 14px; }
    main { max-width: 850px; margin: 24px auto; padding: 0 14px; }
    .panel {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px #17203308;
    }
    .product-top {
      display: grid;
      grid-template-columns: minmax(0, 220px) 1fr;
      gap: 24px;
      align-items: center;
    }
    .photo {
      width: 100%;
      height: 210px;
      object-fit: contain;
      border-radius: 12px;
      background: #f8fafc;
    }
    h1 { font-size: 23px; line-height: 1.8; margin: 8px 0; }
    .muted { color: #687386; font-size: 13px; line-height: 2; }
    .tag {
      display: inline-block;
      background: #fff0ec;
      color: #c83d29;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
    }
    h2 { font-size: 18px; margin-top: 0; }
    .offer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 0;
      border-top: 1px solid #edf0f4;
    }
    .shop { font-weight: bold; margin-bottom: 8px; }
    .price { color: #16834a; font-weight: bold; font-size: 17px; }
    .buy {
      display: inline-block;
      background: #e94b35;
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 13px;
      white-space: nowrap;
    }
    .notice {
      background: #fff8e7;
      color: #805b12;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 2;
      margin-top: 14px;
    }
    .state { text-align: center; line-height: 2.2; }
    footer { text-align: center; color: #778092; padding: 24px 12px; font-size: 12px; }
    @media (max-width: 560px) {
      .product-top { grid-template-columns: 1fr; gap: 12px; }
      .photo { height: 190px; }
      .panel { padding: 16px; }
      h1 { font-size: 20px; }
      .offer { align-items: flex-start; }
      .buy { padding: 10px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">TorobLite</div>
    <a class="back" href="products.html">← بازگشت به محصولات</a>
  </header>

  <main>
    <div id="content" class="panel state">در حال بارگذاری محصول…</div>
  </main>

  <footer>© 2026 TorobLite — مقایسه قیمت‌ها</footer>

  <script>
    const content = document.getElementById("content");
    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    function element(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function formatPrice(price) {
      const number = Number(price);
      if (!Number.isFinite(number) || number < 0) return "قیمت نامشخص";
      return number.toLocaleString("fa-IR") + " تومان";
    }

    async function loadProduct() {
      if (!id) {
        content.textContent = "شناسه محصول مشخص نیست.";
        return;
      }

      try {
        const response = await fetch("./data.json");
        if (!response.ok) throw new Error("data");
        const data = await response.json();
        const products = Array.isArray(data.products) ? data.products : [];
        const product = products.find(p => String(p.id) === id);

        if (!product) {
          content.textContent = "این محصول پیدا نشد.";
          return;
        }

        document.title = product.name + " | TorobLite";
        content.className = "panel";
        content.replaceChildren();

        const top = element("section", "product-top");
        const image = element("img", "photo");
        image.src = product.image || "";
        image.alt = product.name || "تصویر محصول";
        image.loading = "lazy";
        image.addEventListener("error", () => {
          image.removeAttribute("src");
          image.alt = "تصویر محصول در دسترس نیست";
        });

        const details = element("div");
        details.append(
          element("span", "tag", product.category || "محصول"),
          element("h1", "", product.name || "محصول بدون نام"),
          element("p", "muted", "قیمت‌ها و لینک‌های فروشگاه‌ها را بررسی کنید.")
        );
        top.append(image, details);
        content.append(top);

        const offerPanel = element("section", "panel");
        offerPanel.append(element("h2", "", "فروشگاه‌ها و قیمت‌ها"));

        const offers = Array.isArray(product.offers) ? [...product.offers] : [];
        offers.sort((a, b) => Number(a.price) - Number(b.price));

        if (!offers.length) {
          offerPanel.append(element("p", "muted", "هنوز فروشگاهی برای این محصول ثبت نشده است."));
        }

        offers.forEach(offer => {
          const row = element("div", "offer");
          const info = element("div");
          info.append(
            element("div", "shop", offer.shop || "فروشگاه"),
            element("div", "price", formatPrice(offer.price))
          );
          row.append(info);

          try {
            const url = new URL(offer.url);
            if (url.protocol === "https:" || url.protocol === "http:") {
              const link = element("a", "buy", "مشاهده در فروشگاه");
              link.href = url.href;
              link.target = "_blank";
              link.rel = "noopener noreferrer";
              row.append(link);
            }
          } catch (_) {
            row.append(element("span", "muted", "لینک موجود نیست"));
          }
          offerPanel.append(row);
        });

        offerPanel.append(
          element("div", "notice",
            "توجه: قیمت‌ها و فروشگاه‌های فعلی نمونه‌اند و زنده یا تأییدشده نیستند. پیش از خرید، قیمت و موجودی را در سایت فروشنده بررسی کنید.")
        );

        content.after(offerPanel);
      } catch (error) {
        content.textContent =
          "بارگذاری محصول ناموفق بود. اتصال اینترنت و فایل data.json را بررسی کنید.";
      }
    }

    loadProduct();
  </script>
</body>
</html>
